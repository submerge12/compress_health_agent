# P0-1: required CI for compress_health_agent.
# Typecheck + build + full unit suite + real migration tests (clean DB and
# upgrade DB) against a throwaway PostgreSQL instance. All jobs must pass —
# no continue-on-error.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector is required by 0000 (embeddings); the stock image lacks it.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: compass
          POSTGRES_PASSWORD: compass
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U compass"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://compass:compass@localhost:5433/compass_health
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Migrate service database (gate proof)
        run: |
          pg_isready -h localhost -p 5433 -U compass
          psql "postgres://compass:compass@localhost:5433/postgres" -c 'CREATE DATABASE compass_health' || true
          pnpm db:migrate

      - name: Unit + domain tests (includes migration invariants on throwaway DBs)
        run: pnpm test
